<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Вход — Тайм-трекер</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <main class="container narrow" style="padding-top: 8vh">

    <section class="card">
      <h1 class="h1">Тайм-трекер</h1>
      <p class="muted">Учёт рабочего времени сотрудников</p>

      <div id="alertBox" hidden></div>

      <!-- Форма входа -->
      <form id="loginForm" class="form-grid" novalidate>
        <div class="field">
          <label class="label" for="login">Логин</label>
          <input class="input" id="login" name="login" type="text"
                 autocomplete="username" required maxlength="50" placeholder="admin">
        </div>
        <div class="field">
          <label class="label" for="password">Пароль</label>
          <input class="input" id="password" name="password" type="password"
                 autocomplete="current-password" required maxlength="200" placeholder="••••••••">
        </div>
        <p class="error-text" id="loginError" hidden></p>
        <div class="form-actions">
          <button class="btn btn-primary btn-block btn-start" type="submit">Войти</button>
        </div>
      </form>

      <!-- Первый запуск: создание администратора -->
      <form id="setupForm" class="form-grid" hidden>
        <div class="alert alert-info">
          Первый запуск: создайте учётную запись руководителя.
          Запомните логин и пароль — повторно создать администратора нельзя.
        </div>
        <div class="field">
          <label class="label" for="setupFullName">ФИО руководителя</label>
          <input class="input" id="setupFullName" type="text" required maxlength="120"
                 autocomplete="name" placeholder="Иванов Иван Иванович">
        </div>
        <div class="field">
          <label class="label" for="setupLogin">Логин</label>
          <input class="input" id="setupLogin" type="text" required maxlength="50"
                 autocomplete="username" placeholder="admin">
        </div>
        <div class="field">
          <label class="label" for="setupPassword">Пароль</label>
          <input class="input" id="setupPassword" type="password" required minlength="6"
                 maxlength="200" autocomplete="new-password" placeholder="минимум 6 символов">
        </div>
        <div class="field">
          <label class="label" for="setupPassword2">Повторите пароль</label>
          <input class="input" id="setupPassword2" type="password" required minlength="6"
                 maxlength="200" autocomplete="new-password">
        </div>
        <p class="error-text" id="setupError" hidden></p>
        <div class="form-actions">
          <button class="btn btn-primary btn-block btn-start" type="submit">Создать администратора</button>
        </div>
      </form>

      <p class="muted" id="hint" style="margin-top: 14px; text-align: center"></p>
    </section>

  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
